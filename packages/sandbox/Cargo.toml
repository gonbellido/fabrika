[package]
name = "fabrika-sandbox"
version = "1.0.0"
edition = "2021"
description = "Fabrika WASM sandbox — isolated extension execution with resource limits"

[dependencies]
wasmtime = "25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"

[lib]
name = "fabrika_sandbox"
path = "src/lib.rs"

[[bin]]
name = "sandbox-sidecar"
path = "src/main.rs"

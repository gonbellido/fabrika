[package]
name = "fabrika-sandbox"
version = "1.0.0"
edition = "2021"
description = "Fabrika WASM sandbox — isolated extension execution with resource limits"

[dependencies]
wasmtime = "25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[lib]
name = "fabrika_sandbox"
path = "src/lib.rs"

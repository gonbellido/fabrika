version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fabrika-postgres
    environment:
      POSTGRES_USER: fabrika
      POSTGRES_PASSWORD: fabrika_dev
      POSTGRES_DB: fabrika
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrika"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fabrika-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/fabrika
      KC_DB_USERNAME: fabrika
      KC_DB_PASSWORD: fabrika_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start-dev
      - --http-port=8080
      - --proxy-headers=xforwarded

volumes:
  postgres_data:
